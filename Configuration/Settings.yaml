Devclaim:
  NeosModeration:
    types: {}
    # More screens of the moderation app, next to the inbox, provided by other packages (README "Screens"):
    # key: {label, uri (a JSON API of the collection contract), privilegeTarget}
    screens: {}

Neos:
  Flow:
    mvc:
      routes:
        'Devclaim.NeosModeration':
          position: 'before Neos.Neos'
    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            requestPatterns:
              # the app and its API use the Neos backend session; not logged in: the login of Neos, then back
              'Devclaim.NeosModeration:Controllers':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Devclaim\NeosModeration\Controller\.*'
  Neos:
    moduleConfiguration:
      # Neos 9.2's login redirect falls through to current([]) for a leaf-only root module.
      # Keep the existing preferences and add moderation before the user fallback: moderators without the content
      # module land in the moderation app, which has the address of the module (Routes.yaml). Moderators who may
      # open the content module but not publish to live land there too (ModeratorStartAspect).
      preferredStartModules: ['content', 'moderation', 'user/usersettings']
    modules:
      moderation:
        label: 'Moderation'
        controller: 'Devclaim\NeosModeration\Controller\ModerationController'
        description: 'Review submitted moderation cases'
        icon: 'fas fa-shield-alt'
        privilegeTarget: 'Devclaim.NeosModeration:Backend.Module'
        mainStylesheet: 'Lite'
    Ui:
      # "Moderation" in the top bar of the content module, with the number of open cases (Public/NeosUi/Toolbar.js)
      resources:
        javascript:
          '@devclaim/neos-moderation':
            resource: 'resource://Devclaim.NeosModeration/Public/NeosUi/Toolbar.js'
        stylesheets:
          '@devclaim/neos-moderation':
            resource: 'resource://Devclaim.NeosModeration/Public/NeosUi/Toolbar.css'
